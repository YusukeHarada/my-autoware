# Lane change scenario.
# Ego overtakes a slow vehicle by changing to the adjacent lane.

ScenarioFormatVersion: "2.1.0"
ScenarioName: "LaneChange"
ScenarioDescription: "Ego performs a lane change to overtake a slow NPC vehicle."
HostVehicle: sample_vehicle
Map:
  Filepath: /autoware_map/nishishinjuku_autoware_map

Entities:
  - name: ego
    type: EgoVehicle
    InitialState:
      position: { x: 0.0, y: 0.0, z: 0.0 }
      heading: 0.0
      speed: 8.33   # 30 km/h

  - name: slow_car
    type: NPC
    subtype: Car
    InitialState:
      position: { x: 20.0, y: 0.0, z: 0.0 }
      heading: 0.0
      speed: 2.78   # 10 km/h (blocking ego lane)

Events:
  - name: SetGoal
    trigger: { type: Elapsed, value: 0.5 }
    action:
      type: SetGoalPose
      entity: ego
      position: { x: 100.0, y: 0.0, z: 0.0 }

  - name: Engage
    trigger: { type: Elapsed, value: 1.0 }
    action: { type: Engage, entity: ego }

Success:
  - condition:
      type: EgoPassedPose
      position: { x: 80.0, y: 0.0 }
      tolerance: 5.0

Failure:
  - condition: { type: Collision, entities: [ego, slow_car] }
  - condition: { type: Elapsed, value: 90.0 }
