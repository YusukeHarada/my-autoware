# Emergency stop scenario.
# A pedestrian steps into the path 15 m ahead — ego must stop before impact.

ScenarioFormatVersion: "2.1.0"
ScenarioName: "EmergencyStop"
ScenarioDescription: "Ego detects a pedestrian and executes emergency braking."
HostVehicle: sample_vehicle
Map:
  Filepath: /autoware_map/nishishinjuku_autoware_map

Entities:
  - name: ego
    type: EgoVehicle
    InitialState:
      position: { x: 0.0, y: 0.0, z: 0.0 }
      heading: 0.0
      speed: 8.33   # 30 km/h

  - name: pedestrian_1
    type: NPC
    subtype: Pedestrian
    InitialState:
      position: { x: 15.0, y: 0.5, z: 0.0 }
      heading: 1.5708  # perpendicular to ego lane
      speed: 0.0

Events:
  - name: SetGoal
    trigger: { type: Elapsed, value: 0.5 }
    action:
      type: SetGoalPose
      entity: ego
      position: { x: 60.0, y: 0.0, z: 0.0 }

  - name: Engage
    trigger: { type: Elapsed, value: 1.0 }
    action: { type: Engage, entity: ego }

  - name: PedestrianCross
    trigger: { type: Elapsed, value: 3.0 }
    action:
      type: SetVelocity
      entity: pedestrian_1
      value: 1.2   # walking speed m/s

Success:
  - condition:
      type: VehicleStopped
      entity: ego
      tolerance: 1.5
      reference: pedestrian_1

Failure:
  - condition: { type: Collision, entities: [ego, pedestrian_1] }
  - condition: { type: Elapsed, value: 60.0 }
